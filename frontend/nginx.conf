server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 整个应用挂在 /chuilei/eval/ 下；裸访问根路径时重定向过去
    location = / {
        return 301 /chuilei/eval/;
    }

    # API 代理：/chuilei/eval/api/ → 后端 /api/（去掉前缀）
    location /chuilei/eval/api/ {
        proxy_pass http://score-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态资源（dist 部署在 html/chuilei/eval/），SPA 回退到其 index.html
    location /chuilei/eval/ {
        try_files $uri $uri/ /chuilei/eval/index.html;
    }
}
